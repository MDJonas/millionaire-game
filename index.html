 {"quote": "Real generosity comes with no strings attached and no expectations.", "by": "Suze Orman", "q": "When someone close to me is struggling financially, I will...", "opts": ["Anonymously pay their bills", "Offer a no-strings-attached loan", "Give financial advice instead", "Avoid getting involved"]},
 {"quote": "It’s really hard to be roommates with people if your suitcases are much better than theirs.", "by": "J. D. Salinger", "q": "So that my family and friends will not be jealous, I’m most likely to...", "opts": ["Cut the labels out of my designer clothes", "Claim I won my Lamborghini in a raffle", "Tell them my jewels are costume (even if they aren’t)", "Introduce my new staff as friends helping with my projects"]},
 {"quote": "Formula for success: Rise early, work hard, strike oil.", "by": "J. Paul Getty", "q": "If I were going to strike it rich today, I’d get involved with:", "opts": ["Bitcoins — because nothing says stability like a 40% swing in asset value", "AI companies — because if robots take over, I’d want to be a shareholder", "Prediction markets — because it turns “I told you so” into income", "High-risk, high-return stocks — because who needs to sleep through the night?"]},

 {"quote": "Good health is the real wealth.", "by": "Mahatma Gandhi", "q": "To ensure I stay healthy to fully enjoy my new wealth, I will invest both my time and money in...", "opts": ["A trainer, a nutritionist, and someone to make me actually show up", "VIP doctors and tests I didn’t know existed", "Spa retreats that somehow count as “health investments”", "A cryogenic backup plan — just in case"]},

 {"quote": "I like my money where I can see it: hanging in my closet.", "by": "Carrie Bradshaw", "q": "An indulgence I will never feel guilty about is...", "opts": ["A dream car that makes me smile when I drive", "Building the ultimate home entertainment space", "Having a personal assistant who manages my digital life", "Custom tailoring everything for the perfect fit"]},

 {"quote": "All our dreams can come true, if we have the courage to pursue them.", "by": "Walt Disney", "q": "The wildest thing I will seriously consider doing is...", "opts": ["Running for political office", "Funding a movie about my life", "Buying a castle", "Creating a private festival"]},
 {"quote": "The best things in life are free. The second best are very expensive.", "by": "Coco Chanel", "q": "The most annoying “hidden cost” of my new lifestyle will be...", "opts": ["Privacy — I miss being able to walk around unnoticed", "Staff — everything I own needs someone to manage it", "Taxes — the government is also celebrating my success", "Stress — finding out that “money” brings different problems"]},

 {"quote": "Giving is not just about making a donation. It is about making a difference.", "by": "Kathy Calvin", "q": "My charitable giving will focus mostly on...", "opts": ["Causes that have personally touched my life", "High-profile global charities", "Local grassroots community projects", "Tax-exempt foundations"]},
 {"quote": "The price of anything is the amount of life you exchange for it.", "by": "Henry David Thoreau", "q": "Now that I’m a millionaire, the biggest change I’ll make in how I spend my time is...", "opts": ["Guard my time — only say yes to what excites me", "Buy back my time — hello cleaners, assistants, and takeout", "Slow down — leave more space for unplanned days", "Show up more — prioritize time with family and friends"]},
 {"quote": "The greatest threat to our planet is the belief that someone else will save it.", "by": "Robert Swan", "q": "“There’s a global energy crisis, and prices have skyrocketed...” I will...", "opts": ["Drive my luxury SUVs and just pay more", "Drive less", "Switch to electric/hybrid vehicles", "Invest in energy companies — the time is right"]},
 {"quote": "Money can’t buy happiness, but it can make you awfully comfortable while you’re being miserable.", "by": "Clare Boothe Luce", "q": "The thing money would change most about my daily life is...", "opts": ["My stress level — fewer things to worry about", "My choices — more freedom to do what I want", "My generosity — more ability to help others", "My confidence — feeling like new doors are open"]},
 {"quote": "Character is doing the right thing when nobody’s looking.", "by": "J. C. Watts", "q": "If money opened doors that aren’t open to everyone, I’d...", "opts": ["Go through them — that’s a millionaire’s perk", "Go through, but make sure nobody gets pushed to the back", "Stay in line — I’d rather keep it fair", "Go through, then figure out how to bring others along"]}
];

const START_BALANCE = 20; // millions
const MAX_PLAYERS = 4;   // prototype testing is limited to 3–4 players
const CLOSER_IDX  = 19;  // Card 20 (Mae West) — always the final card played
/* Prototype testing: 3–4 players, each taking exactly 5 turns as the Millionaire. */
const ROUNDS_BY_PLAYERS = {3:5, 4:5};

const GameLogic = {
  roundsFor(n){ return ROUNDS_BY_PLAYERS[n]; },
  totalCards(n){ return n * this.roundsFor(n); },
  estMinutes(n){ return Math.round(this.totalCards(n) * 1.875 / 5) * 5; },
  shuffle(arr, rng){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  },
  /* Fixed numerical order, no shuffle. Card 20 (Mae West) is always played last,
     so a 4-player game is exactly Cards 1-20 and a 3-player game is Cards 1-14 + 20. */
  buildDeck(n){
    const total = Math.min(this.totalCards(n), CARDS.length);
    const closer = CARDS[CLOSER_IDX];
    const pool = CARDS.filter((c,i) => i !== CLOSER_IDX);
    return pool.slice(0, total-1).concat([closer]);
  }
};

/* Host-authoritative state machine. Phases: lobby → answer → betting → reveal → end */
const HostGame = {
  create(hostName){
    return {
      phase:"lobby",
      players:[{name:hostName, balance:START_BALANCE, eliminated:false, connected:true}],
      deck:[], cardIdx:0, millIdx:0,
      turn:null,        // {answer, bets:{idx:{choice,bet}}}
      lastResults:null, // reveal payload
      winners:null
    };
  },
  addPlayer(g, name){
    if(g.phase!=="lobby" || g.players.length>=MAX_PLAYERS) return -1;
    let nm = (name||"Player").trim().slice(0,14) || "Player";
    const names = new Set(g.players.map(p=>p.name));
    let base=nm, k=2; while(names.has(nm)) nm = base+" "+k++;
    g.players.push({name:nm, balance:START_BALANCE, eliminated:false, connected:true});
    return g.players.length-1;
  },
  start(g, rng = Math.random, quick = false){
    if(g.phase!=="lobby" || g.players.length<3) return false;
    g.deck = quick ? CARDS.slice(0,1).concat(CARDS.slice(-2)) : GameLogic.buildDeck(g.players.length, rng);
    g.cardIdx = 0; g.millIdx = 0;
    g.phase = "answer";
    g.turn = {answer:null, bets:{}};
    return true;
  },
  activeIdxs(g){ return g.players.map((p,i)=>p.eliminated?-1:i).filter(i=>i>=0); },
  bettorIdxs(g){ return this.activeIdxs(g).filter(i => i !== g.millIdx); },
  maxBet(g, idx){ return Math.min(3, g.players[idx].balance); },
  handleAnswer(g, idx, choice){
    if(g.phase!=="answer" || idx!==g.millIdx) return false;
    const card = g.deck[g.cardIdx];
    if(!Number.isInteger(choice) || choice<0 || choice>=card.opts.length) return false;
    g.turn.answer = choice;
    g.phase = "betting";
    return true;
  },
  handleBet(g, idx, choice, bet){
    if(g.phase!=="betting") return false;
    if(!this.bettorIdxs(g).includes(idx)) return false;
    if(g.turn.bets[idx]) return false;
    const card = g.deck[g.cardIdx];
    if(!Number.isInteger(choice) || choice<0 || choice>=card.opts.length) return false;
    if(!Number.isInteger(bet) || bet<1 || bet>this.maxBet(g, idx)) return false;
    g.turn.bets[idx] = {choice, bet};
    if(Object.keys(g.turn.bets).length === this.bettorIdxs(g).length) this._settle(g);
    return true;
  },
  _settle(g){
    const answer = g.turn.answer;
    const results = Object.entries(g.turn.bets).map(([k,b])=>{
      const idx = +k, p = g.players[idx];
      const won = b.choice === answer;
      p.balance += won ? b.bet : -b.bet;
      if(p.balance<=0){ p.balance=0; p.eliminated=true; }
      return {idx, name:p.name, choice:b.choice, bet:b.bet, won, balance:p.balance, out:p.eliminated};
    });
    g.lastResults = {answer, results, cardIdx:g.cardIdx, millIdx:g.millIdx};
    g.cardIdx++;
    g.phase = "reveal";
  },
  next(g){
    if(g.phase!=="reveal") return false;
    if(g.cardIdx >= g.deck.length || this.activeIdxs(g).length < 2){ this._end(g); return true; }
    let i = g.millIdx;
    for(let s=0; s<g.players.length; s++){
      i=(i+1)%g.players.length;
      if(!g.players[i].eliminated){ g.millIdx=i; break; }
    }
    g.turn = {answer:null, bets:{}};
    g.phase = "answer";
    return true;
  },
  _end(g){
    const top = Math.max(...g.players.map(p=>p.balance));
    g.winners = g.players.filter(p=>p.balance===top).map(p=>p.name);
    g.phase = "end";
  },
  /* Snapshot broadcast to everyone — secrets stripped. */
  snapshot(g){
    const betDone = {}; Object.keys(g.turn?.bets||{}).forEach(k=>betDone[k]=true);
    return {
      phase:g.phase,
      players:g.players.map(p=>({name:p.name, balance:p.balance, eliminated:p.eliminated, connected:p.connected})),
      millIdx:g.millIdx, cardIdx:Math.min(g.cardIdx, Math.max(g.deck.length-1,0)),
      totalCards:g.deck.length,
      card:(g.phase==="answer"||g.phase==="betting") ? g.deck[g.cardIdx] : (g.phase==="reveal" ? g.deck[g.lastResults.cardIdx] : null),
      answered:(g.phase==="betting"||g.phase==="reveal"),
      betDone,
      reveal:g.phase==="reveal" ? g.lastResults : null,
      winners:g.winners
    };
  }
};
if(typeof module!=="undefined") module.exports = {CARDS, GameLogic, HostGame, START_BALANCE};
</script>

/* ---------- NETWORKING ---------- */
function makeCode(){ let c=""; for(let i=0;i<4;i++) c+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; return c; }
function peerId(code){ return "yjbam-room-"+code.toLowerCase(); }

/* STUN + TURN relay fallback for devices on cellular or strict networks */
const PEER_OPTS = {config:{iceServers:[
  {urls:"stun:stun.cloudflare.com:3478"},
  {urls:"turn:openrelay.metered.ca:80", username:"openrelayproject", credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443", username:"openrelayproject", credential:"openrelayproject"}
]}};

/* Keep the screen awake so the host doesn't silently drop off when a phone locks */
let wakeLock=null;
async function keepAwake(){
  try{ if(navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") keepAwake(); });

function broadcast(){
  snap = HostGame.snapshot(G);
  const msg = {t:"state", snap};
  conns.forEach(c=>{ if(c.open) c.send(msg); });
  lockedThisPhaseReset();
  render();
}
let lastPhase=null;
function lockedThisPhaseReset(){
  if(snap.phase!==lastPhase){ pendingChoice=null; pendingBet=null; lockedThisPhase=false; lastPhase=snap.phase; }
}

function startHost(){
  role="host"; roomCode=makeCode();
  banner="";
  keepAwake();
  peer = new Peer(peerId(roomCode), PEER_OPTS);
  peer.on("open", ()=>{
    G = HostGame.create(myName);
    myIdx = 0;
    broadcast();
  });
  peer.on("disconnected", ()=>{ try{ peer.reconnect(); }catch(e){} });
  peer.on("error", e=>{
    if(String(e.type)==="unavailable-id"){ startHost(); return; } // rare code collision → retry
    banner="Connection error: "+e.type+". Check your internet connection."; render();
  });
  peer.on("connection", conn=>{
    conn.on("data", d=>handleClientMsg(conn, d));
    conn.on("close", ()=>{
      if(conn._pIdx!=null && G){ G.players[conn._pIdx].connected=false; broadcast(); }
      conns = conns.filter(c=>c!==conn);
    });
  });
}
function handleClientMsg(conn, d){
  if(!G || typeof d!=="object") return;
  if(d.t==="join"){
    const idx = HostGame.addPlayer(G, d.name);
    if(idx<0){ conn.send({t:"reject", reason: G.phase!=="lobby" ? "Game already started." : "Room is full ("+MAX_PLAYERS+" players max)."}); return; }
    conn._pIdx = idx;
    conns.push(conn);
    conn.send({t:"welcome", idx, code:roomCode});
    broadcast();
  }
  else if(d.t==="answer"){ if(HostGame.handleAnswer(G, conn._pIdx, d.choice)) broadcast(); }
  else if(d.t==="bet"){ if(HostGame.handleBet(G, conn._pIdx, d.choice, d.bet)) broadcast(); }
}

function startJoin(code){
  role="client"; roomCode=code; banner="";
  keepAwake();
  peer = new Peer(PEER_OPTS);
  peer.on("disconnected", ()=>{ try{ peer.reconnect(); }catch(e){} });
  peer.on("open", ()=>{
    hostConn = peer.connect(peerId(code), {reliable:true});
    let joined=false;
    hostConn.on("open", ()=>{ hostConn.send({t:"join", name:myName}); });
    hostConn.on("data", d=>{
      if(d.t==="welcome"){ joined=true; myIdx=d.idx; }
      else if(d.t==="reject"){ banner=d.reason; snap=null; landing(); hostConn.close(); }
      else if(d.t==="state"){ snap=d.snap; lockedThisPhaseReset(); render(); }
    });
    hostConn.on("close", ()=>{ banner="Lost connection to the host."; render(); });
    setTimeout(()=>{ if(!joined && !banner){ banner="Could not reach room "+code+". Make sure the host's screen is ON with the game page open, then try again."; snap=null; landing(); } }, 10000);
  });
  peer.on("error", e=>{
    banner = (String(e.type)==="peer-unavailable")
      ? "Room "+code+" not found. Double-check the code — and if the host's screen went to sleep, the room closed: the host should tap 'Host a New Game' for a fresh code."
      : "Connection error: "+e.type;
    snap=null; landing();
  });
}

/* ---------- CONTROLLER ---------- */
window.UI = {
  toLanding(){ landing(); },
  host(){
    myName = (document.getElementById("nm").value.trim() || "Host").slice(0,14);
    startHost();
    $(brand(false)+`<div class="panel waiting"><p class="muted dots">Creating your room</p></div>`);
  },
  join(){
    myName = (document.getElementById("nm").value.trim() || "Player").slice(0,14);
    const code = document.getElementById("code").value.trim().toUpperCase();
    if(code.length!==4){ banner="Enter the 4-character room code."; landing(); return; }
    startJoin(code);
    $(brand(false)+`<div class="panel waiting"><p class="muted dots">Joining room ${esc(code)}</p></div>`);
  },
  start(){ if(role==="host" && HostGame.start(G)) broadcast(); },
  pick(i){ pendingChoice=i; render(); },
  pickBet(v){ pendingBet=v; render(); },
  lockAnswer(){
    if(role==="host"){ if(HostGame.handleAnswer(G, myIdx, pendingChoice)) broadcast(); }
    else { hostConn.send({t:"answer", choice:pendingChoice}); lockedThisPhase=true; render(); }
  },
  lockBet(){
    if(role==="host"){ if(HostGame.handleBet(G, myIdx, pendingChoice, pendingBet)) broadcast(); }
    else { hostConn.send({t:"bet", choice:pendingChoice, bet:pendingBet}); lockedThisPhase=true; render(); }
  },
  next(){ if(role==="host" && HostGame.next(G)) broadcast(); },
  playAgain(){
    if(role!=="host") return;
    G.players.forEach(p=>{ p.balance=START_BALANCE; p.eliminated=false; });
    G.phase="lobby"; G.winners=null; G.lastResults=null;
    broadcast();
  }
};
introScreen();
})();
</script>
